  <circle cx="32" cy="32" r="5" fill="#facc15"/>
  <!-- 闪光 -->
  <path d="M50 14 L 51.6 18.4 L 56 20 L 51.6 21.6 L 50 26 L 48.4 21.6 L 44 20 L 48.4 18.4 Z" fill="#facc15"/>
</svg>
